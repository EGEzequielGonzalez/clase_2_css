<main>

    <section>
        <h1>Contactanos</h1>

        <p>
            Estamos para responder tus consultas y ayudarte con todo lo que necesites.
        </p>
    </section>

    <section>

        <article>
            <h2>Dejanos tu consulta</h2>

            <form action="#">

                <fieldset>
                    <legend>Datos personales</legend>

                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre">

                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido">

                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email">

                </fieldset>

                <label for="comentario">Comentarios</label>

                <textarea 
                    id="comentario" 
                    name="comentario" 
                    placeholder="Escribí tu comentario">
                </textarea>

                <button type="submit">Enviar</button>

            </form>
        </article>

    </section>

    <section>

        <h2>Encontranos</h2>

        <figure>
            <img 
                src="../img/img/interior1.webp" 
                alt="Interior del local de Código Café">
            
            <figcaption>
                Te esperamos para compartir un buen café.
            </figcaption>
        </figure>

    </section>

</main>
